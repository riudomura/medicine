<style>
/* Layout: 1カラム。夜の薬袋——紺の紙に月色のインク。結果は「処方箋」の体裁。 */
:root{
  --night:#121A33; --night-2:#1A2446; --paper:#F4EFE3; --ink:#1D2340;
  --moon:#F2C96B; --mist:#9AA6C8; --line:rgba(242,201,107,.28);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;background:var(--night);color:#E9ECF6;font-family:var(--f-body);font-size:16px;line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;
  background-image:radial-gradient(circle at 85% -10%, rgba(242,201,107,.18), transparent 40%);background-repeat:no-repeat}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
p{margin:0}
button,a{font:inherit}
:focus-visible{outline:2px solid var(--moon);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;padding-block:18px;font-size:13px;color:var(--mist)}
.logo{font-family:var(--f-display);font-size:16px;color:var(--moon);background:none;border:0;padding:0;cursor:pointer;letter-spacing:.08em}

/* home */
.hero{padding-block:32px 8px;display:grid;gap:20px}
.moon{width:72px;height:72px;border-radius:50%;background:var(--moon);box-shadow:0 0 60px rgba(242,201,107,.45);position:relative;overflow:hidden}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--night);transform:translate(22px,-10px)}
.hero h1{font-family:var(--f-display);font-size:clamp(34px,9vw,50px);line-height:1.35;color:#fff}
.hero h1 span{color:var(--moon)}
.lead{color:var(--mist)}
.lead span{display:inline-block}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mist)}
.meta b{color:#fff}
.btn-main{display:block;width:100%;border:0;border-radius:999px;background:var(--moon);color:var(--night);font-weight:700;font-size:18px;padding:17px;cursor:pointer;text-align:center;text-decoration:none;letter-spacing:.06em}
.btn-main:hover{filter:brightness(1.05)}
.btn-ghost{display:block;width:100%;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--moon);font-weight:700;padding:13px;cursor:pointer;text-align:center;text-decoration:none}

/* quiz */
.quiz{padding-block:20px;display:grid;gap:22px}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.12)}
.prog i.on{background:var(--moon)}
.qlabel{font-size:13px;color:var(--moon);letter-spacing:.12em}
.qtext{font-family:var(--f-display);font-size:clamp(26px,7vw,34px);line-height:1.45;color:#fff}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:1px solid rgba(255,255,255,.14);background:var(--night-2);color:#fff;border-radius:16px;padding:16px 14px;text-align:left;font-weight:500;line-height:1.5;cursor:pointer;transition:border-color .12s,transform .08s}
.opt small{display:block;color:var(--mist);font-size:12px;font-weight:400;margin-top:2px}
.opt:hover{border-color:var(--moon)}
.opt:active{transform:scale(.98)}
.opt.picked{border-color:var(--moon);background:rgba(242,201,107,.12)}
.back{justify-self:start;border:0;background:none;color:var(--mist);font-size:14px;text-decoration:underline;cursor:pointer;padding:4px 0}
.back:disabled{visibility:hidden}

/* result: 処方箋 */
.rx{margin-top:20px;background:var(--paper);color:var(--ink);border-radius:6px;padding:26px 22px 22px;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.rx::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 20px);opacity:.85;border-radius:6px 6px 0 0}
.rx-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid rgba(29,35,64,.25);padding-bottom:12px}
.rx-title{font-family:var(--f-display);font-size:22px;letter-spacing:.3em}
.rx-meta{font-size:12px;line-height:1.6;text-align:right;color:#4A5072;font-variant-numeric:tabular-nums}
.rx-row{display:grid;grid-template-columns:7em 1fr;gap:8px;padding-block:10px;border-bottom:1px dashed rgba(29,35,64,.2);font-size:14px}
.rx-row dt{color:#4A5072}
.rx-row dd{margin:0;font-weight:500}
.rx-song{padding-block:20px 8px;display:grid;gap:6px;position:relative}
.rx-song.stamped{padding-right:84px}
.rx-song .lbl{font-size:12px;color:#4A5072;letter-spacing:.12em}
.rx-song h2{font-family:var(--f-display);font-size:clamp(30px,8.5vw,44px);line-height:1.25;color:var(--ink)}
.rx-song .from{font-size:13px;color:#4A5072}
.rx-desc{font-size:15px;padding-block:6px 14px}
.why{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:14px;font-size:12px}
.why span{color:#4A5072;letter-spacing:.08em;margin-right:2px}
.why i{font-style:normal;border:1px solid rgba(29,35,64,.35);border-radius:999px;padding:2px 10px;font-weight:500}
.rx-usage{font-size:13px;background:rgba(29,35,64,.06);border-radius:6px;padding:10px 12px}
.rx-usage b{font-weight:700}
.stamp{position:absolute;right:0;top:18px;width:72px;height:72px;border:3px solid #B5332E;border-radius:50%;color:#B5332E;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:13px;line-height:1.2;transform:rotate(-14deg);opacity:.85;pointer-events:none}
.listen{margin-top:16px;display:block;text-align:center;background:var(--ink);color:var(--paper);border-radius:999px;padding:14px;font-weight:700;text-decoration:none}
.listen:hover{opacity:.9}

.care{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px;color:#E9ECF6;display:grid;gap:6px}
.care b{color:var(--moon)}
.care .num{font-variant-numeric:tabular-nums;user-select:all}

.section-h{font-family:var(--f-display);font-size:20px;color:#fff;margin-block:36px 12px}
.alts{display:grid;gap:10px}
.alt{display:grid;gap:2px;border:1px solid rgba(255,255,255,.12);background:var(--night-2);border-radius:14px;padding:14px 16px;text-decoration:none;color:#fff}
.alt b{font-family:var(--f-display);font-size:18px}
.alt span{font-size:13px;color:var(--mist)}
.alt em{font-style:normal;font-size:12px;color:var(--moon)}

.share{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sbtn{border:0;border-radius:12px;padding:12px 4px;font-weight:700;font-size:14px;text-align:center;text-decoration:none;color:#fff;cursor:pointer}
.sbtn.x{background:#000;border:1px solid rgba(255,255,255,.2)}
.sbtn.line{background:#06C755}
.sbtn.copy{background:var(--night-2);border:1px solid rgba(255,255,255,.2)}
.note{font-size:13px;color:var(--mist)}
.actions{display:grid;gap:10px;margin-top:24px}

/* library */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--moon);color:var(--night);border-color:var(--moon)}
.lib{display:grid;gap:8px}
.lib a{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.08);padding-block:8px;color:#fff;text-decoration:none}
.lib a span{font-size:12px;color:var(--mist);text-align:right;flex:none}
.lib a b{font-weight:500;min-width:0}
.count{font-size:12px;color:var(--mist);margin-bottom:6px;font-variant-numeric:tabular-nums}
.foot{margin-top:40px;font-size:12px;color:var(--mist);text-align:center;display:grid;gap:6px}
.foot a{color:var(--mist)}

@keyframes rise{from{transform:translateY(10px);opacity:.2}to{transform:none;opacity:1}}
.anim{animation:rise .4s ease-out}
@media (prefers-reduced-motion:reduce){.anim{animation:none}}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
</style>
</head>

<div class="wrap">
  <header class="top">

  <main id="v-home">

  </main>

  <main id="v-result" hidden></main>

  <footer class="foot">

  </footer>
</div>

  if(a.wish && s.wish.includes(a.wish)) m.push(L('wish',a.wish));
  if(a.cause && s.cause.includes(a.cause)) m.push(L('cause',a.cause));
  if(a.tone && (s.tone===a.tone || (a.tone==='light' && s.tone==='bright'))) m.push(L('tone',a.tone));
  if(s.need.includes(a.need)) m.push(NEEDS[a.need].l);
  return m;
}
function scoreSong(s, a){
  let sc = 0;
  if(s.mood.includes(a.mood)) sc += 5 - s.mood.indexOf(a.mood);
  if(a.rel){ if(s.rel.includes(a.rel)) sc += 4; else if(!s.rel.length) sc -= 2; }
  if(a.time && s.time===a.time) sc += 2.5;
  if(a.wish && s.wish.includes(a.wish)) sc += 3;
  if(a.cause) sc += s.cause[0]===a.cause ? 3.5 : s.cause.includes(a.cause) ? 2 : 0;
  if(a.tone) sc += s.tone===a.tone ? 2.5 : (a.tone==='light' && s.tone==='bright') ? 1 : 0;
  if(s.need.includes(a.need)) sc += 3;
  if(s.scene.includes(a.scene)) sc += 1;
  sc -= Math.abs((s.energy||3) - a.energy) * 0.6;
  return sc + Math.random()*0.5;
}
function rank(a){ return SONGS.map(s=>({s, sc:scoreSong(s,a)})).sort((x,y)=>y.sc-x.sc); }

function finish(){
  const r = rank(ans);
  const main = r[0].s, alts = r.slice(1,4).map(x=>x.s);
  try{ history.replaceState(null,'','#'+main.id); }catch(e){}
  renderResult(main, alts, ans);
}

function today(){
  const d=new Date(); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function usage(a){
  const sc = a ? SCENES[a.scene].l : '好きなとき';
  const n = a && a.need==='cry' ? '泣きたいだけ泣いてから' : a && a.need==='hype' ? '音量を少し上げて' : 'ひと息ついて';
  return `<b>用法</b>：${sc}に、${n}1回。効かなければ、何度でもどうぞ。`;
}

function renderResult(s, alts, a){
  const v=$('v-result');
  const detail = a ? FOLLOW[a.mood].map(q=>optLabel(q.k, a[q.k], a.mood)).filter(Boolean).join(' ・ ') : '';
  const rows = a ? `
    <dl style="margin:0">
      <div class="rx-row"><dt>いまの気持ち</dt><dd>${MOODS[a.mood].l}</dd></div>
      ${detail?`<div class="rx-row"><dt>くわしく</dt><dd>${esc(detail)}</dd></div>`:''}
      <div class="rx-row"><dt>ほしいもの</dt><dd>${NEEDS[a.need].l}</dd></div>
    </dl>` : '';
  const why = a ? matches(s, a) : [];
  const whyHtml = why.length ? `<div class="why"><span>選んだ理由</span>${why.map(w=>`<i>${esc(w)}</i>`).join('')}</div>` : '';
  const shareText = a
    ? `今日の私に処方されたのは、堂村璃羽「${s.title}」でした。\n#ドウムラ処方箋`
    : `堂村璃羽「${s.title}」\n#ドウムラ処方箋`;
  const shareUrl = SITE()+'#'+s.id;
  const care = (a && a.mood==='dark') || s.intensity==='heavy' ? `
    <div class="care">
      <b>つらい気持ちが続くときは</b>
      <span>ひとりで抱えこまずに、話を聞いてもらってください。匿名で相談できます。</span>
      <span>いのちの電話（ナビダイヤル）：<span class="num">0570-783-556</span></span>
      <span>よりそいホットライン（24時間・無料）：<span class="num">0120-279-338</span></span>
    </div>` : '';

  v.innerHTML = `
    <article class="rx anim">
      <div class="rx-head">
        <h1 class="rx-title">処方箋</h1>
        <div class="rx-meta">${today()}<br>処方：堂村璃羽</div>
      </div>
      ${rows}
      <div class="rx-song${a?' stamped':''}">
        ${a?'<div class="stamp" aria-hidden="true">堂村<br>処方済</div>':''}
        <div class="lbl">${a?'あなたに処方する一曲':'この曲について'}</div>
        <h2>${esc(s.title)}</h2>
        <div class="from">${esc(fromText(s))}</div>
      </div>
      <p class="rx-desc">${esc(s.desc)}</p>
      ${whyHtml}
      <p class="rx-usage">${usage(a)}</p>
      <a class="listen" href="${esc(listenUrl(s))}" target="_blank" rel="noopener">この曲を聴く</a>
    </article>
    ${care}

    <h2 class="section-h">${a?'ほかにも効きそうな曲':'似た気持ちの曲'}</h2>
    <div class="alts">${alts.map(x=>`
      <a class="alt" href="${esc(listenUrl(x))}" target="_blank" rel="noopener">
        <b>${esc(x.title)}</b><span>${esc(x.desc)}</span><em>聴く →</em>
      </a>`).join('')}</div>

    <h2 class="section-h">シェアする</h2>
    <div class="share">
      <a class="sbtn x" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}">Xでポスト</a>
      <a class="sbtn line" target="_blank" rel="noopener" href="https://line.me/R/msg/text/?${encodeURIComponent(shareText+'\n'+shareUrl)}">LINEで送る</a>
      <button class="sbtn copy" type="button" id="copyBtn">リンクをコピー</button>
    </div>
    <p class="note" id="copied" aria-live="polite"></p>

    <div class="actions">
      <button class="btn-main" type="button" id="againBtn">${a?'もう一度処方してもらう':'自分の気持ちで処方してもらう'}</button>
      <button class="btn-ghost" type="button" id="homeBtn">気持ちから曲を探す</button>
    </div>`;
  $('againBtn').onclick=startQuiz;
  $('homeBtn').onclick=goHome;
  $('copyBtn').onclick=()=>{
    const out=$('copied');
    const fail=()=>{ out.textContent='コピーできませんでした。このリンクを長押ししてコピーしてください：'+shareUrl; };
    try{ navigator.clipboard.writeText(shareUrl).then(()=>{ out.textContent='コピーしました'; }, fail); }catch(e){ fail(); }
  };
  show('result');
}

// ===== 曲を探す =====
let filter='all';
function renderLib(){
  const keys = ['all', ...Object.keys(MOODS)];
  $('filters').innerHTML = keys.map(k=>`<button type="button" class="chip${filter===k?' on':''}" data-k="${k}">${k==='all'?'すべて':MOODS[k].l}</button>`).join('');
  $('filters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ filter=b.dataset.k; renderLib(); });
  const list = SONGS.filter(s=> filter==='all' || s.mood.includes(filter));
  $('libCount').textContent = `${list.length}曲`;
  $('lib').innerHTML = list.map(s=>`<a href="#${s.id}" data-id="${s.id}"><b>${esc(s.title)}</b><span>${s.mood.map(m=>MOODS[m]?.l).filter(Boolean).slice(0,2).join(' ・ ')}</span></a>`).join('');
  $('lib').querySelectorAll('a').forEach(a=>a.onclick=e=>{ e.preventDefault(); openSong(a.dataset.id); });
}
function openSong(id){
  const s = SONGS.find(x=>x.id===id); if(!s){ goHome(); return; }
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  const alts = SONGS.filter(x=>x!==s && x.mood[0]===s.mood[0]).sort(()=>Math.random()-.5).slice(0,3);
  renderResult(s, alts, null);
}
function goHome(){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} show('home'); }

$('songCount').textContent = SONGS.length;
$('startBtn').onclick = startQuiz;
$('backBtn').onclick = ()=>{ if(qi>0){ qi--; renderQ(); } };
$('logo').onclick = goHome;
renderLib();
const h = location.hash.slice(1);
if(h && SONGS.some(s=>s.id===h)) openSong(h); else show('home');
</script>
